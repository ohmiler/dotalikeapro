name: Patch check

# ตรวจ patch ใหม่ของ Dota 2 จากแพตช์โน้ตทางการของ Valve ทุก 6 ชั่วโมง
# - มี patch ใหม่ → อัปเดต src/patch.ts แล้ว commit เข้า main (Cloudflare deploy เว็บใหม่ให้เอง)
# - ถ้ากฎเกมที่เกี่ยวกับบทเรียนเปลี่ยน → เปิด Issue พร้อมรายงานว่าต้องตรวจบทไหน
# - ถ้าดึงข้อมูลไม่ได้ / รูปแบบข้อมูลเปลี่ยน → workflow ล้ม GitHub จะส่งอีเมลแจ้งเจ้าของ repo
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: patch-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Check for a new patch
        id: check
        run: node scripts/check-patch.mjs

      - name: Commit updated patch numbers
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/patch.ts
          git commit -m "chore: sync patch to ${{ steps.check.outputs.latest }}"
          git push

      - name: Open an issue when lesson-relevant rules changed
        if: steps.check.outputs.mechanics == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Patch ${{ steps.check.outputs.latest }}: กฎเกมที่เกี่ยวกับบทเรียนเปลี่ยน — ต้องตรวจบทเรียน" \
            --body-file patch-report.md
